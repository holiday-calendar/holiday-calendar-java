name: "Calendar Docs Drift Check"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-calendar-docs:
    name: Verify calendar reference docs are updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run calendar docs drift check
        env:
          CALENDAR_DOCS_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: python3 .github/scripts/check_calendar_docs.py
